<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1280" width="768" height="1280" role="img" aria-labelledby="title desc">
  <title id="title">Bing Weather (WP8/8.1) hourly pane with application bar — self-authored schematic</title>
  <desc id="desc">Flat deep-blue hourly pane mockup with the bottom application bar: locations, search, current location, refresh and overflow ellipsis. Not an original screenshot.</desc>

  <defs>
    <g id="cloud" fill="#E8F4FF">
      <circle cx="-22" cy="6" r="18"/>
      <circle cx="2" cy="-6" r="24"/>
      <circle cx="26" cy="6" r="16"/>
      <rect x="-28" y="4" width="56" height="16"/>
    </g>
    <g id="drop" fill="#7FB2D9">
      <path d="M0,-15 C7,-5 11,3 0,12 C-11,3 -7,-5 0,-15 Z"/>
    </g>
  </defs>

  <rect x="0" y="0" width="768" height="1280" fill="#0A2E4E"/>

  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="3" fill="#9CC0DC">SEATTLE, WA</text>

  <text x="48" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="300" fill="#FFFFFF">hourly</text>
  <text x="286" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="300" fill="#6E97B8">maps</text>
  <text x="486" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="300" fill="#6E97B8">today</text>
  <text x="686" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="300" fill="#6E97B8">daily</text>

  <g stroke="#1B4A70" stroke-width="1">
    <line x1="0" y1="250" x2="768" y2="250"/>
    <line x1="0" y1="390" x2="768" y2="390"/>
    <line x1="0" y1="530" x2="768" y2="530"/>
    <line x1="0" y1="670" x2="768" y2="670"/>
    <line x1="0" y1="810" x2="768" y2="810"/>
    <line x1="0" y1="950" x2="768" y2="950"/>
  </g>

  <!-- row 1 -->
  <text x="48" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">14:00</text>
  <use href="#cloud" transform="translate(384,320)"/>
  <text x="520" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">21&#176;</text>
  <use href="#drop" transform="translate(652,316)"/>
  <text x="720" y="332" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">0%</text>

  <!-- row 2 -->
  <text x="48" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">15:00</text>
  <use href="#cloud" transform="translate(384,460)"/>
  <text x="520" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">21&#176;</text>
  <use href="#drop" transform="translate(652,456)"/>
  <text x="720" y="472" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">10%</text>

  <!-- row 3 -->
  <text x="48" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">16:00</text>
  <use href="#cloud" transform="translate(384,600)"/>
  <text x="520" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">20&#176;</text>
  <use href="#drop" transform="translate(652,596)"/>
  <text x="720" y="612" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">20%</text>

  <!-- row 4 -->
  <text x="48" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">17:00</text>
  <use href="#cloud" transform="translate(384,740)"/>
  <text x="520" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">19&#176;</text>
  <use href="#drop" transform="translate(652,736)"/>
  <text x="720" y="752" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">30%</text>

  <!-- row 5 -->
  <text x="48" y="894" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">18:00</text>
  <use href="#cloud" transform="translate(384,880)"/>
  <text x="520" y="900" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">18&#176;</text>
  <use href="#drop" transform="translate(652,876)"/>
  <text x="720" y="892" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">40%</text>

  <!-- row 6 -->
  <text x="48" y="1034" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#FFFFFF">19:00</text>
  <use href="#cloud" transform="translate(384,1020)"/>
  <text x="520" y="1040" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="200" fill="#FFFFFF">17&#176;</text>
  <use href="#drop" transform="translate(652,1016)"/>
  <text x="720" y="1032" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#B8D4EA">30%</text>

  <!-- bottom application bar -->
  <rect x="0" y="1140" width="768" height="140" fill="#000000" opacity="0.8"/>
  <line x1="0" y1="1140" x2="768" y2="1140" stroke="#2A5A80" stroke-width="1"/>

  <!-- locations -->
  <circle cx="110" cy="1198" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M103,1204 L110,1221 L117,1204 Z" fill="#FFFFFF"/>
  <text x="110" y="1254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B8D4EA">locations</text>

  <!-- search -->
  <circle cx="266" cy="1196" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="274" y1="1204" x2="284" y2="1214" stroke="#FFFFFF" stroke-width="3"/>
  <text x="270" y="1254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B8D4EA">search</text>

  <!-- current location -->
  <circle cx="430" cy="1206" r="10" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="430" y1="1190" x2="430" y2="1198" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="430" y1="1214" x2="430" y2="1222" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="414" y1="1206" x2="422" y2="1206" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="438" y1="1206" x2="446" y2="1206" stroke="#FFFFFF" stroke-width="3"/>
  <text x="430" y="1254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B8D4EA">current location</text>

  <!-- refresh -->
  <path d="M578,1206 a13,13 0 1,0 13,-13" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M591,1186 L598,1194 L587,1197 Z" fill="#FFFFFF"/>
  <text x="590" y="1254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#B8D4EA">refresh</text>

  <!-- overflow ellipsis -->
  <circle cx="693" cy="1206" r="4" fill="#FFFFFF"/>
  <circle cx="705" cy="1206" r="4" fill="#FFFFFF"/>
  <circle cx="717" cy="1206" r="4" fill="#FFFFFF"/>
</svg>
